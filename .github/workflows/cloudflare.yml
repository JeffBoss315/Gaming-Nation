name: Publish to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 25

      - name: Check Cloudflare token
        id: check
        shell: bash
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
            echo "Cloudflare token found."
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "ERROR: CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi

      - name: Build website
        if: steps.check.outputs.ready == 'yes'
        run: node tools/build-www.js

      - name: Verify build
        if: steps.check.outputs.ready == 'yes'
        run: |
          test -f www/login.html || {
            echo "ERROR: www/login.html is missing"
            exit 1
          }

          echo "Build successful."
          echo "Files:"
          find www -type f | wc -l

      - name: Deploy to Gaming Nation
        if: steps.check.outputs.ready == 'yes'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'c54290a31703c611a3387fd22b2c147a' }}
          command: pages deploy www --project-name=gaming-nation --branch=main

      - name: Deployment complete
        run: |
          echo "Gaming Nation: https://gaming-nation.pages.dev"
