# Publish the website to Cloudflare Pages.
#
# WHY A RED X HERE MIGHT NOT MEAN THE SITE IS BROKEN
#
# There are two ways this site reaches Cloudflare, and only one of them is
# this file:
#
#   1. Cloudflare's own Git integration. The project is connected to this
#      repository in the dashboard, so Cloudflare checks out every push and
#      builds it itself. Nothing here is involved and no secret is needed.
#      This is what has actually been publishing the site.
#
#   2. This workflow, which needs CLOUDFLARE_API_TOKEN.
#
# So this job failing does not necessarily mean the site is stale — check
# https://gaming-nation.pages.dev before believing the X. What it does mean
# is that one of the two paths is broken, and a workflow that goes red on
# every push teaches people to ignore red, which is worse than not having it.
#
# The steps below therefore distinguish the two things that used to look
# identical: a token that is ABSENT (a choice — you are using the dashboard
# build) from a token that is PRESENT AND REJECTED (a fault — fix it).

name: Publish to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # The token goes through env rather than being interpolated into the
      # script. A secret pasted straight into a shell line is one stray
      # quote away from being a command.
      - name: Is there a token to deploy with
        id: check
        shell: bash
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN is set."
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            {
              echo "### Cloudflare deploy skipped"
              echo ""
              echo "No \`CLOUDFLARE_API_TOKEN\` is set on this repository, so this"
              echo "workflow has nothing to deploy with."
              echo ""
              echo "That is fine if Cloudflare builds this repo itself — check"
              echo "**Workers & Pages → gaming-nation → Settings → Builds & deployments**."
              echo "If it does, the site is already being published and this workflow"
              echo "is redundant."
              echo ""
              echo "To deploy from here instead, add the secret under"
              echo "**Settings → Secrets and variables → Actions**. It needs the"
              echo "**Cloudflare Pages: Edit** permission and nothing more."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "No token set — skipping the deploy. See the run summary."
          fi

      # Asked before wrangler is anywhere near it, because wrangler's answer
      # to a bad token is "Authentication failed (status: 400) [code: 9106]",
      # which says nothing about which of the several possible things is
      # actually wrong.
      - name: Is the token any good
        if: steps.check.outputs.ready == 'yes'
        shell: bash
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'c54290a31703c611a3387fd22b2c147a' }}
        run: |
          set -u

          verify=$(curl -sS -X GET \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" || echo '{"success":false}')

          if ! echo "$verify" | grep -q '"success":true'; then
            {
              echo "### The Cloudflare token was rejected"
              echo ""
              echo "\`CLOUDFLARE_API_TOKEN\` is set, but Cloudflare will not accept it."
              echo "The usual reasons, in the order worth checking:"
              echo ""
              echo "1. It expired, or was rolled in the Cloudflare dashboard."
              echo "2. It was pasted with a stray space or newline."
              echo "3. It is an **API key** rather than an **API token** — they are"
              echo "   different things and only a token works here."
              echo ""
              echo "Make a new one at **My Profile → API Tokens → Create Token**"
              echo "with **Cloudflare Pages: Edit**, and replace the repository secret."
              echo ""
              echo "Cloudflare said:"
              echo ""
              echo '```'
              echo "$verify" | head -c 800
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            echo "The token was rejected by Cloudflare. See the run summary."
            exit 1
          fi

          echo "Token accepted by Cloudflare."

          # A token can be perfectly valid and still not reach THIS project.
          project=$(curl -sS -X GET \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/pages/projects/gaming-nation" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" || echo '{"success":false}')

          if ! echo "$project" | grep -q '"success":true'; then
            {
              echo "### The token works, but the project does not"
              echo ""
              echo "Cloudflare accepted the token and then refused"
              echo "\`accounts/$ACCOUNT/pages/projects/gaming-nation\`."
              echo ""
              echo "Either the account id is wrong, or there is no Pages project"
              echo "named exactly \`gaming-nation\` on it, or the token is scoped to"
              echo "a different account."
              echo ""
              echo "Cloudflare said:"
              echo ""
              echo '```'
              echo "$project" | head -c 800
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            echo "The Pages project could not be reached. See the run summary."
            exit 1
          fi

          echo "Pages project gaming-nation is reachable."

      # Pages validates every binding when it publishes a Function, so an
      # r2_buckets block naming a bucket that does not exist does not merely
      # disable the download gate — it fails the publish, and the SITE does
      # not go out. wrangler.toml has carried that warning as a comment for a
      # while; a comment cannot stop anybody, so this does.
      #
      # Only looks when the binding is actually live. While it stays
      # commented out this step says so and moves on.
      - name: If a bucket is bound, make sure it exists
        if: steps.check.outputs.ready == 'yes'
        shell: bash
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'c54290a31703c611a3387fd22b2c147a' }}
        run: |
          set -u

          # an uncommented bucket_name, i.e. one that will really be bound
          bucket=$(grep -E '^[[:space:]]*bucket_name[[:space:]]*=' wrangler.toml \
                   | head -1 | sed -E 's/.*=[[:space:]]*"([^"]+)".*/\1/')

          if [ -z "$bucket" ]; then
            echo "No R2 bucket is bound in wrangler.toml — nothing to check."
            exit 0
          fi

          echo "wrangler.toml binds the R2 bucket: $bucket"

          buckets=$(curl -sS -X GET \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/r2/buckets" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" || echo '{"success":false}')

          if ! echo "$buckets" | grep -q '"success":true'; then
            {
              echo "### Could not check R2"
              echo ""
              echo "\`wrangler.toml\` binds the bucket \`$bucket\`, and this token"
              echo "could not list R2 buckets to confirm it exists."
              echo ""
              echo "Publishing with a binding whose bucket is missing fails the whole"
              echo "deploy — the site would not go out — so this stops here instead."
              echo ""
              echo "Either give the token **Workers R2 Storage: Read**, or comment the"
              echo "\`[[r2_buckets]]\` block back out until the bucket is made."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "R2 could not be checked. See the run summary."
            exit 1
          fi

          if ! echo "$buckets" | grep -q "\"name\":\"$bucket\""; then
            {
              echo "### The bound R2 bucket does not exist"
              echo ""
              echo "\`wrangler.toml\` binds \`$bucket\`, and this account has no bucket"
              echo "by that name. Publishing would fail on the Function and take the"
              echo "site with it, so the deploy stopped here."
              echo ""
              echo "Make it:"
              echo ""
              echo '```'
              echo "npx wrangler r2 bucket create $bucket"
              echo "npm run release:push"
              echo '```'
              echo ""
              echo "Or comment the \`[[r2_buckets]]\` block out again and the download"
              echo "gate stays off, which is how it has been running."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "The bucket $bucket does not exist. See the run summary."
            exit 1
          fi

          echo "R2 bucket $bucket exists — safe to publish the Function."

      - name: Build website
        if: steps.check.outputs.ready == 'yes'
        run: node tools/build-www.js

      # A deploy that publishes an empty directory takes the site down and
      # reports success. Check something is actually there first.
      - name: Verify build
        if: steps.check.outputs.ready == 'yes'
        shell: bash
        run: |
          test -f www/login.html || {
            echo "ERROR: www/login.html is missing — the build produced nothing to publish"
            exit 1
          }
          echo "Built $(find www -type f | wc -l) files."

      # Run from the repository root, not from www/, because that is where
      # wrangler looks for functions/ — the download gate is a Pages Function
      # and deploying the folder alone would leave it behind.
      - name: Deploy to Gaming Nation
        if: steps.check.outputs.ready == 'yes'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'c54290a31703c611a3387fd22b2c147a' }}
          command: pages deploy www --project-name=gaming-nation --branch=main

      - name: Where it went
        if: steps.check.outputs.ready == 'yes'
        run: echo "Published to https://gaming-nation.pages.dev"
