<h1>🚛 Heavyline Logistics</h1>

    Create a new password for your Heavyline driver account.

<label for="newPassword">

</label>

<input
    id="newPassword"
    type="password"
    placeholder="Enter new password"
    autocomplete="new-password"
>

<label for="confirmPassword">
    Confirm Password
</label>

<input
    id="confirmPassword"
    type="password"
    placeholder="Confirm new password"
    autocomplete="new-password"

```

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>

<script src="supabase-client.js"></script>

<script>

const message =
    document.getElementById('message');

const passwordInput =
    document.getElementById('newPassword');

const confirmInput =
    document.getElementById('confirmPassword');

const updateButton =
    document.getElementById('updatePasswordBtn');


// ----------------------------------------------------
// CHECK SUPABASE CLIENT
// ----------------------------------------------------

if (!window.hllSupabase) {

    console.error(
        'Heavyline Supabase client is unavailable.'
    );

    message.textContent =
        'Supabase connection is unavailable.';

    updateButton.disabled = true;
}


// ----------------------------------------------------
// CHECK RECOVERY SESSION
// ----------------------------------------------------

async function checkRecoverySession() {

    try {

        const {
            data,
            error
        } = await window.hllSupabase.auth.getSession();

        if (error) {

            console.error(
                'Session error:',
                error
            );

            message.textContent =
                'Unable to verify password reset session.';

            updateButton.disabled = true;

            return;
        }

        if (!data.session) {

            console.warn(
                'No password recovery session found.'
            );

            message.textContent =
                'Please open the password reset link from your email again.';

            updateButton.disabled = true;

            return;
        }

        console.log(
            '✅ Heavyline password recovery session active.'
        );

        message.textContent =
            'Enter your new password below.';

        updateButton.disabled = false;

    } catch (error) {

        console.error(
            'Recovery session check failed:',
            error
        );

        message.textContent =
            'Something went wrong while checking your reset session.';

        updateButton.disabled = true;
    }
}


// ----------------------------------------------------
// UPDATE PASSWORD
// ----------------------------------------------------

updateButton.addEventListener(
    'click',
    async () => {

        const password =
            passwordInput.value.trim();

        const confirmPassword =
            confirmInput.value.trim();


        // Validate password

        if (!password) {

            message.textContent =
                'Enter a new password.';

            passwordInput.focus();

            return;
        }


        if (password.length < 6) {

            message.textContent =
                'Password must be at least 6 characters.';

            passwordInput.focus();

            return;
        }


        if (password !== confirmPassword) {

            message.textContent =
                'Passwords do not match.';

            confirmInput.focus();

            return;
        }


        updateButton.disabled = true;

        updateButton.textContent =
            'UPDATING...';

        message.textContent =
            'Updating your password...';


        try {

            const {
                data,
                error
            } = await window.hllSupabase.auth.updateUser({
                password: password
            });


            if (error) {

                console.error(
                    'Password update failed:',
                    error
                );

                message.textContent =
                    'Could not update password: ' +
                    error.message;

                updateButton.disabled = false;

                updateButton.textContent =
                    'UPDATE PASSWORD';

                return;
            }


            console.log(
                '✅ Password updated successfully.',
                data
            );


            message.textContent =
                '✅ Password updated successfully! Redirecting to login...';


            passwordInput.value = '';
            confirmInput.value = '';


            setTimeout(() => {

                window.location.href =
                    'index.html';

            }, 2000);


        } catch (error) {

            console.error(
                'Unexpected password update error:',
                error
            );

            message.textContent =
                'Something went wrong. Please try again.';

            updateButton.disabled = false;

            updateButton.textContent =
                'UPDATE PASSWORD';
        }
    }
);


// ----------------------------------------------------
// ALLOW ENTER KEY
// ----------------------------------------------------

confirmInput.addEventListener(
    'keydown',
    (event) => {

        if (event.key === 'Enter') {

            event.preventDefault();

            updateButton.click();
        }
    }
);


// ----------------------------------------------------
// START
// ----------------------------------------------------

checkRecoverySession();

</script>

</body>
