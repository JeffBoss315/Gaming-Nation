</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>

<script src="supabase-client.js"></script>

<script>

const message =
    document.getElementById('message');

const passwordInput =
    document.getElementById('newPassword');

const confirmInput =
    document.getElementById('confirmPassword');

const updateButton =
    document.getElementById('updatePasswordBtn');


// ----------------------------------------------------
// CHECK SUPABASE CLIENT
// ----------------------------------------------------

if (!window.hllSupabase) {

    console.error(
        'Gaming Nation Supabase client is unavailable.'
    );

    message.textContent =
        'Supabase connection is unavailable.';

    updateButton.disabled = true;
}


// ----------------------------------------------------
// CHECK RECOVERY SESSION
// ----------------------------------------------------

/* ----------------------------------------------------
   WHAT SUPABASE SENDS BACK WHEN THE LINK IS NO GOOD

   A reset link that has expired, been used, or been opened
   twice does not come back as an error the page can catch. It
   comes back as a redirect carrying the reason in the URL
   fragment:

     #error=access_denied&error_code=otp_expired
      &error_description=Email+link+is+invalid+or+has+expired

   Nothing here read that, so the page fell through to its
   generic "open the link from your email again" — which is
   precisely what the person had just done, and it does not
   tell them the link is dead or that they need a fresh one.
   ---------------------------------------------------- */
function recoveryProblem() {
    const raw = (location.hash || '').replace(/^#/, '');
    if (!raw) return null;

    const q = new URLSearchParams(raw);
    const code = q.get('error_code');
    const err = q.get('error');
    if (!code && !err) return null;

    /* Supabase writes it with + for spaces; URLSearchParams handles that. */
    const described = q.get('error_description') || '';

    if (code === 'otp_expired') {
        return 'That reset link has expired. They are only good for a short '
            + 'while, and only once. Ask for a new one and use it straight away.';
    }
    if (err === 'access_denied') {
        return 'That reset link is no longer valid — it has been used already, '
            + 'or it was replaced by a newer one. Ask for a new link.';
    }
    return described || 'That reset link could not be used. Ask for a new one.';
}

function showRecoveryProblem(text) {
    message.textContent = text;
    message.className = 'msg err';
    if (updateButton) updateButton.disabled = true;

    /* Somewhere to go from here. A dead end that only says "no" leaves
       somebody stuck on a page with nothing on it. */
    const back = document.createElement('p');
    back.style.marginTop = '14px';
    const a = document.createElement('a');
    a.href = 'login.html#/login';
    a.textContent = 'Ask for a new reset link';
    a.className = 'link';
    back.appendChild(a);
    message.parentNode.insertBefore(back, message.nextSibling);

    /* Clear the fragment so a refresh does not show the same error for a
       link the person has already given up on. */
    try { history.replaceState(null, '', location.pathname + location.search); }
    catch (e) { /* nothing important */ }
}

async function checkRecoverySession() {

    /* Before anything else: did we arrive carrying a refusal? */
    const problem = recoveryProblem();
    if (problem) {
        console.warn('[GMN] password recovery refused:', problem);
        showRecoveryProblem(problem);
        return;
    }


    try {

        const {
            data,
            error
        } = await window.hllSupabase.auth.getSession();

        if (error) {

            console.error(
                'Session error:',
                error
            );

            message.textContent =
                'Unable to verify password reset session.';

            updateButton.disabled = true;

            return;
        }

        if (!data.session) {

            console.warn(
                'No password recovery session found.'
            );

            message.textContent =
                'Please open the password reset link from your email again.';

            updateButton.disabled = true;

            return;
        }

        console.log(
            '✅ Gaming Nation password recovery session active.'
        );

        message.textContent =
            'Enter your new password below.';

        updateButton.disabled = false;

    } catch (error) {

        console.error(
            'Recovery session check failed:',
            error
        );

        message.textContent =
            'Something went wrong while checking your reset session.';

        updateButton.disabled = true;
    }
}


// ----------------------------------------------------
// UPDATE PASSWORD
// ----------------------------------------------------

updateButton.addEventListener(
    'click',
    async () => {

        const password =
            passwordInput.value.trim();

        const confirmPassword =
            confirmInput.value.trim();


        // Validate password

        if (!password) {

            message.textContent =
                'Enter a new password.';

            passwordInput.focus();

            return;
        }


        if (password.length < 6) {

            message.textContent =
                'Password must be at least 6 characters.';

            passwordInput.focus();

            return;
        }


        if (password !== confirmPassword) {

            message.textContent =
                'Passwords do not match.';

            confirmInput.focus();

            return;
        }


        updateButton.disabled = true;

        updateButton.textContent =
            'UPDATING...';

        message.textContent =
            'Updating your password...';


        try {

            const {
                data,
                error
            } = await window.hllSupabase.auth.updateUser({
                password: password
            });


            if (error) {

                console.error(
                    'Password update failed:',
                    error
                );

                message.textContent =
                    'Could not update password: ' +
                    error.message;

                updateButton.disabled = false;

                updateButton.textContent =
                    'UPDATE PASSWORD';

                return;
            }


            console.log(
                '✅ Password updated successfully.',
                data
            );


            message.textContent =
                '✅ Password updated successfully! Redirecting to login...';


            passwordInput.value = '';
            confirmInput.value = '';


            setTimeout(() => {

                window.location.href =
                    'login.html';

            }, 2000);


        } catch (error) {

            console.error(
                'Unexpected password update error:',
                error
            );

            message.textContent =
                'Something went wrong. Please try again.';

            updateButton.disabled = false;

            updateButton.textContent =
                'UPDATE PASSWORD';
        }
    }
);


// ----------------------------------------------------
// ALLOW ENTER KEY
// ----------------------------------------------------

confirmInput.addEventListener(
    'keydown',
    (event) => {

        if (event.key === 'Enter') {

            event.preventDefault();

            updateButton.click();
        }
    }
);


// ----------------------------------------------------
// START
// ----------------------------------------------------

checkRecoverySession();

</script>

</body>
