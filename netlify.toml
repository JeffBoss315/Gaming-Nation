# Netlify — free tier, custom domains included.
#
#   npm run www     builds the site into www/
#   deploy          Netlify publishes that folder
#
# Set siteUrl in site.config.json to the address Netlify gives you
# (https://<name>.netlify.app) and rebuild, so the canonical and the
# sitemap agree with where the site actually is.

[build]
  command = "npm run www"
  publish = "www"

[build.environment]
  NODE_VERSION = "20"

# The site is one document with hash routes behind it, so anything that
# is not a real file has to come back as index.html rather than a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
