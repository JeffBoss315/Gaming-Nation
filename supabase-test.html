<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex,nofollow">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
    <link rel="apple-touch-icon" href="icons/favicon-180.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gaming Nation Supabase Test</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #080b14;
            color: white;
            font-family: Arial, sans-serif;
        }

        .box {
            width: min(600px, 90%);
            padding: 30px;
            border-radius: 16px;
            background: #111827;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        h1 {
            margin-top: 0;
        }

        #result {
            padding: 15px;
            border-radius: 8px;
            background: #1f2937;
            line-height: 1.6;
            word-break: break-word;
        }

        .success {
            color: #3ecf8e;
        }

        .error {
            color: #ff6b6b;
        }

        pre {
            white-space: pre-wrap;
            word-break: break-word;
            color: #cbd5e1;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>🚛 Gaming Nation Supabase Test</h1>

        <p id="result">
            Testing connection...
        </p>

        <pre id="data"></pre>

    </div>


    <!-- Supabase library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>

    <!-- Gaming Nation Supabase configuration -->
    <script src="supabase-client.js"></script>


    <script>

        async function testSupabase() {

            const result = document.getElementById('result');
            const dataOutput = document.getElementById('data');

            try {

                // Check Supabase client
                if (!window.gmnSupabase) {

                    throw new Error(
                        'Gaming Nation Supabase client was not initialized. Check supabase-client.js.'
                    );

                }

                result.textContent = 'Supabase client loaded. Testing drivers table...';

                // Test database connection
                const { data, error } = await window.gmnSupabase
                    .from('drivers')
                    .select('*')
                    .limit(1);

                if (error) {

                    console.error('Database error:', error);

                    result.className = 'error';

                    result.textContent =
                        'Supabase connected, but database request failed: ' +
                        error.message;

                    return;
                }

                console.log('SUPABASE DATA:', data);

                result.className = 'success';

                result.textContent =
                    'SUCCESS! Supabase and the drivers table are connected.';

                dataOutput.textContent =
                    JSON.stringify(data, null, 2);

            } catch (error) {

                console.error('Connection error:', error);

                result.className = 'error';

                result.textContent =
                    'Connection error: ' +
                    (error.message || error);

            }

        }

        testSupabase();

    </script>

</body>

</html>
