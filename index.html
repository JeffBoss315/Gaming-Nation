<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <meta name="theme-color" content="#070910">

    <meta
        name="description"
        content="Heavyline Logistics — the digital headquarters of the HLL fleet. Convoys, drivers, fleet management, rankings and achievements in one command centre."
    >

    <title>Heavyline Logistics — Virtual Trucking Company | Convoys, Fleet &amp; Dispatch</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap"
        rel="stylesheet"
    >

    <!-- =========================================================
         FINDING THIS PAGE

         Only the tags that do not name a host live here. Anything
         absolute — the canonical, og:url, the image URLs, the JSON-LD —
         is written by tools/build-www.js from site.config.json, because
         an absolute URL is a claim about where this site lives and the
         source cannot know that.

         A canonical pointing at a host you do not own is worse than
         none at all: it tells Google the real page is elsewhere.
    ========================================================== -->

    <meta name="robots" content="index,follow,max-image-preview:large">
    <meta name="author" content="Heavyline Logistics">
    <meta name="application-name" content="Heavyline Logistics">

    <!-- what a shared link looks like on Discord, Slack, LinkedIn -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Heavyline Logistics">
    <meta property="og:title" content="Heavyline Logistics — virtual trucking company">
    <meta property="og:description" content="The digital headquarters of the HLL fleet. Convoys, dispatch, live fleet tracking, driver rankings and achievements, in one command centre.">
    <meta property="og:image:alt" content="The Heavyline Logistics emblem">
    <meta property="og:locale" content="en_GB">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Heavyline Logistics — virtual trucking company">
    <meta name="twitter:description" content="Convoys, dispatch, live fleet tracking, driver rankings and achievements, in one command centre.">

    <!-- HLL_SEO — the build injects canonical, og:url, image URLs and
         structured data here when site.config.json names a host. -->

    <!-- App icon -->
    <link rel="icon" href="icons/icon-192.png">

    <!-- Leaflet -->
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css">

    <!-- Heavyline styles -->
    <link rel="stylesheet" href="style.css">

    <!--
        Heavyline has two front-ends:
        - Driver website: index.html
        - Admin console: admin.html
    -->
    <script>
        window.HLL_SITE = 'drivers';

        window.HLL_PAGES = {
            drivers: 'index.html',
            admin: 'admin.html'
        };
    </script>
</head>

<body>

    <!-- =========================================================
         AMBIENT BACKGROUND
    ========================================================== -->

    <div class="bg-fx" aria-hidden="true">
        <div class="bg-grid"></div>
    </div>


    <!-- =========================================================
         APPLICATION SPLASH SCREEN
    ========================================================== -->

    <div
        class="splash"
        id="splash"
        role="status"
        aria-label="Starting Heavyline"
    >

        <div class="splash-inner">

            <div class="splash-word">
                HEAVYLINE
            </div>

            <div class="splash-sub">
                LOGISTICS
            </div>

            <div class="splash-road">

                <div class="splash-fill"></div>

                <div class="splash-lane"></div>

                <svg
                    class="splash-lorry"
                    viewBox="0 0 300 96"
                    aria-hidden="true"
                >

                    <g
                        fill="none"
                        stroke="currentColor"
                        stroke-width="4.6"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <!-- Trailer -->
                        <path d="M8 20 L150 20 L150 66 L8 66 Z"/>
                        <path d="M18 66 L86 66"/>

                        <!-- Sleeper and cab -->
                        <path d="M150 20 C150 12 156 8 164 8 L196 8 C204 8 208 13 210 20"/>
                        <path d="M210 20 L212 40 L214 62 L228 68 L252 68"/>

                        <!-- Windscreen -->
                        <path d="M216 22 L246 20 L250 42 L214 44 Z"/>

                        <!-- Bonnet, grille and bumper -->
                        <path d="M214 44 C226 44 240 48 250 56 L258 62"/>
                        <path d="M258 62 L262 70 L252 74"/>
                        <path d="M252 56 L276 58 L280 72 L252 74"/>
                        <path d="M258 62 L274 63 M258 67 L274 68"/>

                        <!-- Exhaust stack -->
                        <path d="M210 6 L210 26"/>

                        <!-- Wheels -->
                        <circle cx="46" cy="76" r="13"/>
                        <circle cx="46" cy="76" r="5"/>

                        <circle cx="86" cy="76" r="13"/>
                        <circle cx="86" cy="76" r="5"/>

                        <circle cx="176" cy="76" r="13"/>
                        <circle cx="176" cy="76" r="5"/>

                        <circle cx="216" cy="76" r="13"/>
                        <circle cx="216" cy="76" r="5"/>

                    </g>

                </svg>

            </div>

            <div
                class="splash-note"
                id="splashNote"
            >
                Starting…
            </div>

        </div>

    </div>


    <!-- =========================================================
         SPLASH SAFETY TIMER
    ========================================================== -->

    <script>
        window.__hllSplashAt = Date.now();

        window.__hllSplash = setTimeout(function () {

            var splash = document.getElementById('splash');

            if (splash) {
                splash.classList.add('gone');
            }

        }, 9000);
    </script>


    <!-- =========================================================
         APPLICATION ROOT
    ========================================================== -->

    <div
        id="app"
        role="application"
        aria-label="Heavyline Logistics application"
    ></div>


    <!-- Layered UI -->
    <div id="layers"></div>

    <div
        class="toasts"
        id="toasts"
        role="status"
        aria-live="polite"
    ></div>


    <!-- =========================================================
         NO JAVASCRIPT MESSAGE
    ========================================================== -->

    <noscript>

        <div
            style="
                max-width:640px;
                margin:60px auto;
                padding:24px;
                border:1px solid rgba(255,255,255,.14);
                border-radius:20px;
                background:rgba(14,20,30,.8)
            "
        >

            <h1 style="font-size:20px;margin-bottom:8px">
                JavaScript required
            </h1>

            <p style="color:#a5b2c4">
                The Heavyline Logistics command centre is an interactive
                application and needs JavaScript enabled.
            </p>

        </div>

    </noscript>
