<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex,nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">

    <meta name="theme-color" content="#070910">
    <meta name="description"
        content="Heavyline Trucker — the Heavyline Logistics driver client. Records ETS2 runs and syncs them to your driver record.">

    <title>Heavyline Trucker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <link rel="icon" href="icons/icon-192.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Heavyline Trucker">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Heavyline Trucker">

    <link rel="stylesheet" href="vendor/leaflet/leaflet.css">

    <!-- Main Heavyline design -->
    <link rel="stylesheet" href="style.css">

    <!-- Trucker-specific UI -->
    <link rel="stylesheet" href="tracker.css">
</head>

<body>

    <!-- Boot splash -->
    <div class="splash" id="splash" role="status" aria-label="Starting Heavyline">

        <div class="splash-inner">

            <div class="splash-word">HEAVYLINE</div>
            <div class="splash-sub">LOGISTICS</div>

            <!-- Loading road -->
            <div class="splash-road">

                <div class="splash-fill"></div>
                <div class="splash-lane"></div>

                <svg class="splash-lorry"
                     viewBox="0 0 300 96"
                     aria-hidden="true">

                    <g fill="none"
                       stroke="currentColor"
                       stroke-width="4.6"
                       stroke-linecap="round"
                       stroke-linejoin="round">

                        <!-- Trailer -->
                        <path d="M8 20 L150 20 L150 66 L8 66 Z"/>
                        <path d="M18 66 L86 66"/>

                        <!-- Sleeper and cab -->
                        <path d="M150 20 C150 12 156 8 164 8 L196 8 C204 8 208 13 210 20"/>
                        <path d="M210 20 L212 40 L214 62 L228 68 L252 68"/>

                        <!-- Windscreen -->
                        <path d="M216 22 L246 20 L250 42 L214 44 Z"/>

                        <!-- Bonnet, grille and bumper -->
                        <path d="M214 44 C226 44 240 48 250 56 L258 62"/>
                        <path d="M258 62 L262 70 L252 74"/>
                        <path d="M252 56 L276 58 L280 72 L252 74"/>

                        <path d="M258 62 L274 63"/>
                        <path d="M258 67 L274 68"/>

                        <!-- Stack -->
                        <path d="M210 6 L210 26"/>

                        <!-- Wheels -->
                        <circle cx="46" cy="76" r="13"/>
                        <circle cx="46" cy="76" r="5"/>

                        <circle cx="86" cy="76" r="13"/>
                        <circle cx="86" cy="76" r="5"/>

                        <circle cx="176" cy="76" r="13"/>
                        <circle cx="176" cy="76" r="5"/>

                        <circle cx="216" cy="76" r="13"/>
                        <circle cx="216" cy="76" r="5"/>

                    </g>
                </svg>
            </div>

            <div class="splash-note" id="splashNote">
                Starting…
            </div>

        </div>
    </div>

    <!-- Splash safety timer -->
    <script>
        window.__hllSplashAt = Date.now();

        window.__hllSplash = setTimeout(function () {
            var splash = document.getElementById('splash');

            if (splash) {
                splash.classList.add('gone');
            }
        }, 9000);
    </script>


    <!-- Main application -->
    <div class="app" id="app">

        <!-- Desktop title bar -->
        <div class="titlebar">

            <svg class="tb-icon"
                 viewBox="0 0 24 24"
                 fill="currentColor"
                 aria-hidden="true">

                <path d="M2 7h11v9H2zM13 10h4.5l3.5 3.5V16h-8z"/>
                <circle cx="7" cy="18" r="2"/>
                <circle cx="17" cy="18" r="2"/>

            </svg>

            <span class="tb-text">
                Heavyline Trucker — Heavyline Logistics
            </span>

            <div class="tb-controls">

                <button
                    class="tb-btn"
                    data-win="minimize"
                    title="Minimise"
                    aria-label="Minimise">

                    <svg
                        viewBox="0 0 12 12"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.3">

                        <path d="M1 6h10"/>

                    </svg>
                </button>


                <button
                    class="tb-btn"
                    data-win="maximize"
                    title="Maximise"
                    aria-label="Maximise">

                    <svg
                        viewBox="0 0 12 12"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.3">

                        <rect
                            x="1.4"
                            y="1.4"
                            width="9.2"
                            height="9.2"/>

                    </svg>
                </button>


                <button
                    class="tb-btn close"
                    data-win="close"
                    title="Close"
                    aria-label="Close">

                    <svg
                        viewBox="0 0 12 12"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.3">

                        <path d="M1.6 1.6l8.8 8.8M10.4 1.6l-8.8 8.8"/>

                    </svg>
                </button>

            </div>
        </div>


        <!-- Sign-in container -->
        <div class="signin-host" id="signinHost"></div>


        <!-- Mobile app bar -->
        <header class="appbar" id="appbar"></header>


        <div class="body">

            <!-- Desktop navigation rail -->
            <aside class="rail" id="rail">

                <div class="rail-brand">

                    <span class="logo" id="brandLogo"></span>

                    <div class="brand-text">

                        <div class="brand-1">
                            HEAVYLINE
                        </div>

                        <div class="brand-2">
                            Trucker
                        </div>

                    </div>
                </div>


                <nav
                    class="rail-nav"
                    id="nav"
                    aria-label="Sections">
                </nav>


                <div
                    class="rail-foot"
                    id="railFoot">
                </div>

            </aside>


            <!-- Main application content -->
            <main
                class="main"
                id="main"
                role="main">
            </main>

        </div>


        <!-- Connection status -->
        <footer
            class="statusbar"
            id="statusbar"
            aria-label="Connection status">
        </footer>


        <!-- Mobile tab navigation -->
        <nav
            class="tabbar"
            id="tabbar"
            aria-label="Primary">
        </nav>

    </div>


    <!-- Modal / overlay layers -->
    <div id="layers"></div>


    <!-- Toast notifications -->
    <div
        class="toasts"
        id="toasts"
        role="status"
        aria-live="polite">
    </div>


    <!-- JavaScript disabled message -->
    <noscript>
        <div style="padding:24px;color:#e7eaef">
            Heavyline Trucker is an interactive client and requires JavaScript.
        </div>
    </noscript>


    <!-- Libraries -->
    <script src="vendor/leaflet/leaflet.js"></script>

    <!-- Heavyline map data -->
    <script src="map-data.js"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>

    <!-- Heavyline Supabase configuration -->
    <script src="supabase-client.js"></script>

    <!-- Heavyline Trucker application -->
    <script src="tracker.js"></script>

</body>
</html>
