# Cloudflare Pages — free, and reachable from networks that cannot route to
# GitHub Pages. Cloudflare answers from whichever of its edges is nearest,
# on addresses that are almost never blocked; github.io resolves to four
# fixed IPs (185.199.108-111.153) which some ISPs simply do not carry.
#
# Connect the repo at dash.cloudflare.com -> Workers & Pages -> Create ->
# Pages -> Connect to Git. This file tells it what to publish; the build
# command goes in the dashboard:
#
#   Build command      node tools/build-www.js
#   Output directory   www
#
# Do NOT use `npm run www` there: that runs tools/scan.js first, which is a
# release audit and fails on a clean checkout because release/ is gitignored.
# The builder alone needs no dependencies at all.

name = "gaming-nation"
pages_build_output_dir = "www"

# The download gate under functions/ is a Pages Function, and a Function is
# a Worker: it will not publish without a compatibility date. Deploying with
# none of this set fails at the very last step, after the assets have already
# uploaded, with
#
#   Failed to publish your Function.
#   Uncaught Error: No such module "node:stream".
#
# which names a module nothing here imports - the built bundle has no `node:`
# reference in it at all. That is the runtime's way of saying it was handed a
# Worker with no date and no flags, not a complaint about our code.
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# ------------------------------------------------------------------
# WHAT THE SITE KEEPS IN R2
#
# Two things, both too big to sit beside the pages — Cloudflare refuses any
# single asset over 25 MiB:
#
#   the installers   ninety-six megabytes each, handed out by
#                    functions/api/download/[build].js
#   the game map     ETS2 and ATS rendered from the games' own files with
#                    ts-map, served by functions/api/tiles/[[tile]].js
#
# One binding serves both; the tiles live under a tiles/ prefix. Neither
# has a public URL of its own, so the site is the only way to either.
#
# WHY THIS WAS COMMENTED OUT UNTIL NOW: Pages validates every binding when
# it publishes a Function, and a binding naming a bucket that does not
# exist does not merely disable the gate — it fails the whole deploy, after
# the assets have already uploaded:
#
#   Error: Failed to publish your Function. Got error:
#   R2 bucket 'gaming-nation-releases' not found.
#
# R2 had to be switched on in the dashboard first, which a token cannot do
# (the API refuses with code 10042). It is on, the bucket was created on
# 2026-09-13, and the builds are in it — so this is live.
# ------------------------------------------------------------------

[[r2_buckets]]
binding = "RELEASES"
bucket_name = "gaming-nation-releases"

# ------------------------------------------------------------------
# WHERE SUPABASE IS
#
# These are here rather than in the dashboard because a Pages project
# configured by a wrangler.toml takes its configuration from this file and
# ignores what the dashboard holds — so anything left only there would
# quietly stop existing the moment this file started being read.
#
# Not secrets. The publishable key is public by design and already ships
# to every browser in supabase-client.js; the row level security rules in
# supabase/migrations are what actually decide who may read what. The
# Function forwards the driver's own token and holds no credential of its
# own — see approvedDriver() in functions/_lib.js.
# ------------------------------------------------------------------

[vars]
SUPABASE_URL = "https://sfzeauvkguywidrqjntk.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_5UTt258m0KUZigLXraZClw_nkXUTcMx"

