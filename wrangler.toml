# Cloudflare Pages — free, and reachable from networks that cannot route to
# GitHub Pages. Cloudflare answers from whichever of its edges is nearest,
# on addresses that are almost never blocked; github.io resolves to four
# fixed IPs (185.199.108-111.153) which some ISPs simply do not carry.
#
# Connect the repo at dash.cloudflare.com -> Workers & Pages -> Create ->
# Pages -> Connect to Git. This file tells it what to publish; the build
# command goes in the dashboard:
#
#   Build command      node tools/build-www.js
#   Output directory   www
#
# Do NOT use `npm run www` there: that runs tools/scan.js first, which is a
# release audit and fails on a clean checkout because release/ is gitignored.
# The builder alone needs no dependencies at all.

name = "heavyline"
pages_build_output_dir = "www"

# ------------------------------------------------------------------
# The client installers
#
# They are NOT in www/. They live in a private R2 bucket with no public
# URL, and functions/api/download-link.js is the only way to one: it asks
# Supabase — as the signed-in driver, under row level security — whether
# their application is approved, and signs a link that lasts five minutes
# if it is.
#
# That is the difference between a gate and a suggestion. While the
# builds sat on public GitHub Releases, the downloads page decided what
# was OFFERED and anybody with the URL had the file anyway.
#
# SET UP ONCE
#
#   1. Make the bucket
#        npx wrangler r2 bucket create heavyline-releases
#
#   2. Put the builds in it (after npm run dist)
#        npm run release:push
#
#   3. Give the Function a signing secret. Any long random string; it
#      never leaves Cloudflare, and changing it invalidates every link
#      already handed out, which is the way to revoke them.
#        npx wrangler pages secret put HLL_DOWNLOAD_SECRET --project-name=heavyline
#
#   4. Tell it where Supabase is. Not secrets — the anon key is public
#      and is in supabase-client.js — but they belong in the environment
#      rather than baked into a Function.
#        Pages dashboard -> Settings -> Environment variables
#          SUPABASE_URL       https://sfzeauvkguywidrqjntk.supabase.co
#          SUPABASE_ANON_KEY  sb_publishable_...
#
# The binding below is what makes env.RELEASES exist inside the Function.
# ------------------------------------------------------------------

# COMMENTED OUT UNTIL R2 IS TURNED ON.
#
# Pages validates every binding when it publishes a Function, so a binding
# naming a bucket that does not exist does not merely disable the gate —
# it fails the whole deploy. The build succeeded, the site uploaded, and
# then:
#
#   Error: Failed to publish your Function. Got error:
#   R2 bucket 'heavyline-releases' not found.
#
# R2 has to be switched on once in the dashboard before any bucket can be
# made; the API refuses with "Please enable R2 through the Cloudflare
# Dashboard" (code 10042). It is a one-time activation, not something a
# token can do.
#
# Until then the Function deploys without a bucket, reports gate: 'off'
# about itself, and the downloads page falls back to the public URL — see
# functions/api/download-link.js. Uncomment this block the moment
# `npx wrangler r2 bucket create heavyline-releases` succeeds.
#
# [[r2_buckets]]
# binding = "RELEASES"
# bucket_name = "heavyline-releases"
